name: Sync Upstream FreeBSD and Build Staging

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-stage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure Git for Large Operations
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600

      - name: Add FreeBSD Upstream Remote (HTTPS) & Fetch
        run: |
          git remote add upstream https://github.com/freebsd/freebsd-src.git
          git fetch upstream --prune

      - name: Dynamically Sync Upstream Branches, Overlay Midstream, and Build Downstream Staging
        run: |
          # Loop through upstream main and all stable/* branches automatically
          for ref in $(git branch -r | grep -E 'upstream/(main$|stable/)'); do
            branch_path=${ref#upstream/}                  # e.g., "main" or "stable/14"
            safe_name=$(echo "$branch_path" | tr '/' '-')   # e.g., "main" or "stable-14"

            echo "=================================================="
            echo "Processing upstream branch: $branch_path"
            echo "=================================================="

            # 1. Update the upstream mirror branch on origin
            git push origin refs/remotes/upstream/$branch_path:refs/heads/upstream/$safe_name --force-with-lease

            # 2. Setup the downstream staging branch starting from the updated upstream branch
            git checkout -B downstream/staging-$safe_name refs/remotes/upstream/$branch_path

            # 3. Check if a matching midstream branch exists on origin (e.g., midstream/main or midstream/stable-14)
            MIDSTREAM_BRANCH="midstream/$safe_name"
            
            if git ls-remote --exit-code --heads origin "$MIDSTREAM_BRANCH"; then
              echo "Midstream branch '$MIDSTREAM_BRANCH' found. Overlaying changes..."
              git fetch origin "$MIDSTREAM_BRANCH"
              
              # Merge midstream shims on top of upstream
              git merge --no-edit origin/"$MIDSTREAM_BRANCH" || {
                echo "Error: Conflict occurred while merging $MIDSTREAM_BRANCH into downstream/staging-$safe_name."
                exit 1
              }
            else
              echo "Midstream branch '$MIDSTREAM_BRANCH' not found. Proceeding with vanilla upstream."
            fi

            # 4. Push the final combined staging candidate to downstream
            git push origin downstream/staging-$safe_name --force-with-lease
          done