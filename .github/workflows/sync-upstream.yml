name: Sync Upstream FreeBSD and Build Staging

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-stage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git Identity & Network Tuning
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Maximize compression and buffer size for heavy object packfiles
          git config --global core.compression 9
          git config --global http.postBuffer 1073741824
          git config --global http.version HTTP/1.1

      - name: Add FreeBSD Upstream Remote & Fetch
        run: |
          git remote add upstream https://github.com/freebsd/freebsd-src.git
          git fetch upstream --prune --no-tags

      - name: Dynamically Sync Upstream, Overlay Midstream, and Build Downstream
        run: |
          # Process main, stable/*, and releng/* release branches
          for ref in $(git branch -r | grep -E 'upstream/(main$|stable/|releng/)' | grep -v 'HEAD'); do
            branch_path=${ref#upstream/}                  
            safe_name=$(echo "$branch_path" | tr '/' '-')   

            echo "=================================================="
            echo "Processing upstream branch: $branch_path"
            echo "=================================================="

            # Fetch existing remote tracking references from origin
            git fetch origin --prune

            UPSTREAM_TIP=$(git rev-parse refs/remotes/upstream/$branch_path)
            ORIGIN_UPSTREAM_TIP=$(git rev-parse refs/remotes/origin/upstream/$safe_name 2>/dev/null || echo "")

            SYNC_COMPLETE=true

            # -----------------------------------------------------------------
            # STATE 1: INITIALIZATION & INCREMENTAL BACKFILL GATE
            # -----------------------------------------------------------------
            if [ "$ORIGIN_UPSTREAM_TIP" != "$UPSTREAM_TIP" ]; then
              echo "Branch 'upstream/$safe_name' is missing or behind upstream. Verifying timeline..."

              # Generate 1-Year Intervals from 1993 to Current Year
              CURRENT_YEAR=$(date +%Y)
              YEARS=$(seq 1993 $CURRENT_YEAR)

              for year in $YEARS; do
                EPOCH_DATE="${year}-01-01"
                TARGET_HASH=$(git log -1 --format="%H" --until="$EPOCH_DATE" refs/remotes/upstream/$branch_path 2>/dev/null || echo "")

                if [ -n "$TARGET_HASH" ]; then
                  # Check if origin already has this object/commit
                  if ! git branch -r --contains "$TARGET_HASH" | grep -q "origin/upstream/$safe_name"; then
                    echo "Backfilling historical chunk for year $year ($TARGET_HASH)..."
                    if ! git push origin ${TARGET_HASH}:refs/heads/upstream/$safe_name; then
                      echo "::warning::Network threshold reached during $year backfill for $safe_name. Halting backfill for this run."
                      SYNC_COMPLETE=false
                      break
                    fi
                  fi
                fi
              done

              # Final push attempt for the exact head tip if backfilling cleared smoothly
              if [ "$SYNC_COMPLETE" = true ]; then
                echo "Pushing final tip ($UPSTREAM_TIP) to origin/upstream/$safe_name..."
                if ! git push origin refs/remotes/upstream/$branch_path:refs/heads/upstream/$safe_name --force-with-lease; then
                  echo "::warning::Failed to push tip for $safe_name. Will retry on next schedule."
                  SYNC_COMPLETE=false
                fi
              fi
            else
              echo "Branch 'upstream/$safe_name' is 100% in sync with FreeBSD upstream."
            fi

            # Gate Check: Stop early if history backfill is still incomplete for this branch
            if [ "$SYNC_COMPLETE" = false ]; then
              echo "::notice::Skipping Midstream overlay and Downstream staging for $safe_name until backfill completes."
              continue
            fi

            # -----------------------------------------------------------------
            # STATE 2: MIDSTREAM OVERLAY & DOWNSTREAM STAGING BUILD
            # -----------------------------------------------------------------
            echo "Building downstream staging for $safe_name..."

            # 1. Setup local base from the verified upstream reference
            git checkout -B downstream/staging-$safe_name refs/remotes/upstream/$branch_path

            # 2. Check and merge midstream shims if present on origin
            MIDSTREAM_BRANCH="midstream/$safe_name"
            
            if git ls-remote --exit-code --heads origin "$MIDSTREAM_BRANCH" > /dev/null 2>&1; then
              echo "Midstream branch '$MIDSTREAM_BRANCH' found. Overlaying changes..."
              git fetch origin "$MIDSTREAM_BRANCH"
              
              if ! git merge --no-edit origin/"$MIDSTREAM_BRANCH"; then
                echo "::error::Merge conflict detected while applying $MIDSTREAM_BRANCH to $safe_name!"
                git merge --abort
                echo "Skipping downstream build for $safe_name until conflict is resolved manually."
                continue
              fi
            else
              echo "Midstream branch '$MIDSTREAM_BRANCH' not found. Proceeding with vanilla upstream."
            fi

            # 3. Push the final combined staging candidate to downstream
            git push origin downstream/staging-$safe_name --force-with-lease
          done