name: Sync Upstream FreeBSD and Build Staging

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-and-stage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git Identity & Network Tuning
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git config --global core.compression 9
          git config --global http.postBuffer 1073741824
          git config --global http.version HTTP/1.1

      - name: Add FreeBSD Upstream Remote & Fetch
        run: |
          git remote add upstream https://github.com/freebsd/freebsd-src.git
          git fetch upstream --prune --no-tags

      - name: Dynamically Sync Upstream, Overlay Midstream, and Build Downstream
        run: |
          for ref in $(git branch -r | grep -E 'upstream/(main$|stable/)' | grep -v 'HEAD'); do
            branch_path=${ref#upstream/}                  
            safe_name=$(echo "$branch_path" | tr '/' '-')   

            echo "=================================================="
            echo "Processing upstream branch: $branch_path"
            echo "=================================================="

            # 1. Update the upstream mirror branch on origin (Chunked or Incremental)
            if ! git ls-remote --exit-code --heads origin "upstream/$safe_name" > /dev/null 2>&1; then
              echo "First-time sync detected for $safe_name. Pushing in historical chunks to bypass 2GB limit..."
              
              for YEAR in 2005 2015 2022; do
                EPOCH_HASH=$(git log -1 --format="%H" --until="${YEAR}-01-01" refs/remotes/upstream/$branch_path)
                if [ -n "$EPOCH_HASH" ]; then
                  echo "Pushing history up to $YEAR ($EPOCH_HASH)..."
                  git push origin ${EPOCH_HASH}:refs/heads/upstream/$safe_name
                fi
              done
              
              echo "Pushing remaining history..."
              git push origin refs/remotes/upstream/$branch_path:refs/heads/upstream/$safe_name
            else
              echo "Branch exists. Performing standard incremental sync..."
              git push origin refs/remotes/upstream/$branch_path:refs/heads/upstream/$safe_name --force-with-lease
            fi

            # 2. Setup the downstream staging branch
            git checkout -B downstream/staging-$safe_name refs/remotes/upstream/$branch_path

            # 3. Check and merge midstream shims if present
            MIDSTREAM_BRANCH="midstream/$safe_name"
            
            if git ls-remote --exit-code --heads origin "$MIDSTREAM_BRANCH" > /dev/null 2>&1; then
              echo "Midstream branch '$MIDSTREAM_BRANCH' found. Overlaying changes..."
              git fetch origin "$MIDSTREAM_BRANCH"
              
              git merge --no-edit origin/"$MIDSTREAM_BRANCH" || {
                echo "Error: Conflict occurred while merging $MIDSTREAM_BRANCH."
                exit 1
              }
            else
              echo "Midstream branch '$MIDSTREAM_BRANCH' not found. Proceeding with vanilla upstream."
            fi

            # 4. Push the final combined staging candidate to downstream
            git push origin downstream/staging-$safe_name --force-with-lease
          done